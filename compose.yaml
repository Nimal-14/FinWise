services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finwise
      POSTGRES_USER: finwise
      POSTGRES_PASSWORD: finwise_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finwise -d finwise"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - finwise-postgres-data:/var/lib/postgresql/data

volumes:
  finwise-postgres-data:
